name: 기능 요청
description: 새로운 기능을 제안해주세요.
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: 설명
      description: 어떤 기능이 필요한가요?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: 사용 사례
      description: 이 기능이 필요한 상황을 설명해주세요.
